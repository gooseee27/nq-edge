name: NQ Edge scan

on:
  schedule:
    # Every 5 minutes (UTC) over both trading sessions, Monday to Friday UTC:
    #   00:00-07:59 covers the Asia session (Sunday to Thursday evenings, New York time)
    #   13:00-21:59 covers the US day session in both summer and winter time
    # The scan itself only trades inside the real session windows, so extra runs do nothing.
    - cron: "*/5 0-7,13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      action:
        description: "scan = scan and market read. snapshot = also take a gamma snapshot. refresh-all = also redo the levels and experiments numbers."
        type: choice
        default: scan
        options:
          - scan
          - snapshot
          - refresh-all

permissions:
  contents: write

concurrency:
  group: nq-edge
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan and publish
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NQ_ACTION: ${{ inputs.action }}
        run: bash ci/run.sh
